services:
  asistent:
    image: ghcr.io/petrbla/agy-assistant:latest
    pull_policy: always
    container_name: ${CONTAINER_NAME:-asistent}
    restart: unless-stopped
    init: true
    environment:
      LANGUAGE: ${LANGUAGE:-en}
      TZ: ${TZ:-Europe/Prague}
      JMENO: ${JMENO:-}
      TG_TOKEN: ${TG_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      TG_ID: ${TG_ID:-${TELEGRAM_ALLOWED_USERS:-}}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ${VOLUME_HOME:-asistent_home}:/home/asistent
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  asistent_home:
