services:
  asistent:
    image: ghcr.io/petrbla/agy-assistant:latest
    pull_policy: always
    container_name: ${CONTAINER_NAME:-asistent}
    restart: unless-stopped
    init: true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${CONTAINER_NAME:-asistent}"
    environment:
      LANGUAGE: ${LANGUAGE:-en}
      TZ: ${TZ:-Europe/Prague}
      JMENO: ${JMENO:-}
      TG_TOKEN: ${TG_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      TG_ID: ${TG_ID:-${TELEGRAM_ALLOWED_USERS:-}}
      APP_UPDATE_URL: ${APP_UPDATE_URL:-http://updater:8080/v1/update?async=true}
      APP_UPDATE_TOKEN: ${APP_UPDATE_TOKEN:-asistent-updater-token}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ${VOLUME_HOME:-asistent_home}:/home/asistent
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  updater:
    image: nickfedor/watchtower:latest
    container_name: ${CONTAINER_NAME:-asistent}-updater
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "com.centurylinklabs.watchtower.scope=${CONTAINER_NAME:-asistent}"
    environment:
      TZ: ${TZ:-Europe/Prague}
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "false"
      WATCHTOWER_HTTP_API_TOKEN: ${APP_UPDATE_TOKEN:-asistent-updater-token}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: ${CONTAINER_NAME:-asistent}
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  asistent_home:
